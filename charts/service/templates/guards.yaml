{{/*
Every refusal in the chart, evaluated here and rendering nothing.

The filename has no leading underscore on purpose. Helm treats templates/_*
as partials and never executes them, so this file as _guards.yaml was seven
guards that silently did nothing: helm template accepted image.tag=latest, a
canary beside a contract migration, and a PodDisruptionBudget over one pod.
The other three refusals in the chart are the weight checks, and they were
never affected, because service.canaryPods is included from deployment.yaml.
The output is empty, which Helm drops from the manifest.
*/}}
