apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "service.wave" "config" | quote }}
    {{- if .Values.iamRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.iamRoleArn | quote }}
    {{- end }}
# No token is mounted by default. A service that calls the Kubernetes API says
# so in its values, and none of the four here do.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
