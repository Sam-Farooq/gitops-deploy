apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    # Without this, deleting the project orphans its Applications: they keep
    # running, keep reconciling, and belong to nothing.
    - resources-finalizer.argocd.argoproj.io
spec:
  description: The four long running services and the two namespaces they run in
  sourceRepos:
    - https://github.com/Sam-Farooq/gitops-deploy
  destinations:
    - server: https://kubernetes.default.svc
      namespace: platform-staging
    - server: https://kubernetes.default.svc
      namespace: platform-prod
  # An allow list, not a deny list. A deny list is a guess about what will be
  # invented next.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: scheduling.k8s.io
      kind: PriorityClass
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: NetworkPolicy
  # Secret is absent from that list on purpose. Nothing in this repo creates
  # one: the database password is generated by Terraform into Secrets Manager
  # and read through IRSA, so a Secret appearing here would be a committed one.
  orphanedResources:
    # Warn, never delete. The first thing an automatic cleanup finds is
    # something a human created during an incident.
    warn: true
    ignore:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
