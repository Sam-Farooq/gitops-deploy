apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The resources that exist once per cluster, not once per service. Helm owns
# the per-service shape because it repeats four times with different numbers;
# these do not repeat, so templating them would buy a variable and lose the
# ability to read the file.
resources:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow-dns.yaml
  - priorityclasses.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: platform
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
