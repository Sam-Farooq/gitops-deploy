apiVersion: v1
kind: LimitRange
metadata:
  name: platform
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        memory: 256Mi
      max:
        # Smaller than prod on purpose. A container that fits in prod and not
        # in staging is caught by the staging sync, which is the environment
        # that is allowed to break.
        cpu: "1"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
