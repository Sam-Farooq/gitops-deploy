partOf: model-serving
environment: staging
kind: deployment
image:
  repository: ghcr.io/sam-farooq/model-serving
  tag: "2.2.0-rc1"
  pullPolicy: IfNotPresent

containerPort: 8000
service:
  port: 80
  targetPort: http

resources:
  cpu: 300m
  memory: 768Mi

probes:
  liveness: /healthz
  readiness: /readyz
  # The same 240s budget as prod. Shrinking it here would mean staging passes
  # a boot time prod fails, which is the one difference not worth having.
  startupSeconds: 240
  startupPeriodSeconds: 5

lifecycle:
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 90

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 120

canary:
  enabled: false

# minReplicas is 1, so there is no PDB. A budget over a single replica permits
# no eviction at all, and these nodes are spot: a drain that cannot proceed
# waits for the 2 minute termination notice and then loses the pod anyway,
# ungracefully.
pdb:
  enabled: false

migration:
  enabled: false
  strategy: none

config:
  MODEL_REVISION: "2026-08-19"
  MAX_BATCH_SIZE: "8"
logLevel: debug
